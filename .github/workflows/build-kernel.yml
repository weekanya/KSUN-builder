name: Build Nothing Phone (4a) Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nothing-phone-4a-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CLANG_VERSION: clang-r487747c
      USE_CCACHE: "1"
      KBUILD_BUILD_USER: wee
      KBUILD_BUILD_HOST: wee

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Restore Clang toolchain
        id: clang-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/toolchains/linux-x86/${{ env.CLANG_VERSION }}
          key: clang-${{ runner.os }}-${{ runner.arch }}-${{ env.CLANG_VERSION }}

      - name: Download Clang toolchain
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: ./scripts/build.sh sync-toolchain

      - name: Save Clang toolchain
        if: steps.clang-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/toolchains/linux-x86/${{ env.CLANG_VERSION }}
          key: clang-${{ runner.os }}-${{ runner.arch }}-${{ env.CLANG_VERSION }}

      - name: Setup CCache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref }}-
            ccache-${{ runner.os }}-

      - name: Build kernel
        run: ./scripts/build.sh

      - name: Upload build files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nothing-Phone-4a-build-files
          path: |
            artifacts/**
            !artifacts/Nothing-Phone-4a.zip
          if-no-files-found: warn
          retention-days: 7

      - name: Upload AnyKernel3 package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nothing-Phone-4a-AnyKernel3
          path: artifacts/Nothing-Phone-4a.zip
          if-no-files-found: warn
          retention-days: 7
